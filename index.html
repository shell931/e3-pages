<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor E-3</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
    body { margin: 0; min-height: 100vh; background: #111827; }
    body.in { background: #f3f4f6; }
    [hidden] { display: none !important; }
    #app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    aside { background: #111827; color: #e5e7eb; padding: 1rem; overflow: auto; }
    aside h2 { margin: 0 0 .65rem; font-size: 1rem; }
    aside a { color: inherit; text-decoration: none; display: flex; justify-content: space-between; gap: .5rem; padding: .4rem .5rem; border-radius: 6px; }
    aside a:hover, aside a.active { background: #374151; }
    .badge { font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; color: #93c5fd; }
    .badge.ok { color: #34d399; }
    .badge.no { color: #fca5a5; }
    main { padding: 1.5rem 2rem; min-width: 0; }
    h1 { font-size: 1.15rem; margin: 0 0 .35rem; }
    .muted { color: #6b7280; font-size: .85rem; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; margin: .8rem 0 1rem; }
    .kpi { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: .6rem .75rem; }
    .kpi b { display: block; font-size: 1.15rem; }
    .kpi span { font-size: .75rem; color: #6b7280; }
    .ok { color: #047857; font-weight: 600; }
    .no { color: #b45309; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: .45rem .35rem; font-size: .85rem; }
    th { color: #6b7280; font-size: .78rem; }
    .tabla-wrap { max-height: 52vh; overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
    .tabla-wrap thead th { position: sticky; top: 0; background: #fff; }
    .tabla-wrap tbody tr { cursor: pointer; }
    .tabla-wrap tbody tr:hover { background: #f9fafb; }
    .tabla-wrap tbody tr.active { background: #eff6ff; }
    .lote-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); gap: 1rem; }
    .captura { border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; padding: .85rem 1rem; max-height: 52vh; overflow: auto; }
    .conf-bar { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; min-width: 64px; }
    .conf-bar > i { display: block; height: 100%; background: #2563eb; }
    .mini { width: 100%; }
    .login {
      min-height: 100vh; display: grid; place-items: center;
      background: #111827; color: #e5e7eb;
    }
    .card {
      background: #1f2937; border: 1px solid #374151; border-radius: 10px;
      padding: 1.5rem 1.6rem; width: min(380px, 92vw);
    }
    .card h1 { color: #fff; }
    .card label { display: block; font-size: .8rem; color: #9ca3af; margin: .7rem 0 .25rem; }
    .card input {
      width: 100%; box-sizing: border-box; padding: .55rem .6rem;
      border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff;
    }
    .card button {
      margin-top: 1rem; width: 100%; padding: .6rem; border: 0; border-radius: 6px;
      background: #2563eb; color: #fff; font-weight: 600; cursor: pointer;
    }
    .err { color: #fca5a5; font-size: .85rem; min-height: 1.2em; margin-top: .5rem; }
    .out { color: #93c5fd; font-size: .8rem; cursor: pointer; margin: .8rem .5rem 0; }
  </style>
</head>
<body>
  <div id="gate" class="login">
    <form class="card" id="form">
      <h1>Visor E-3</h1>
      <p class="muted" style="color:#9ca3af">Acceso para el comité. Los datos van cifrados en GitHub Pages.</p>
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" required>
      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <div id="app" class="app" hidden>
    <aside>
      <h2>IDP local</h2>
      <nav id="nav"></nav>
      <p class="out" id="out">Cerrar sesión</p>
    </aside>
    <main id="main"></main>
  </div>
  <script>
    const PARTES = [
      { key: "lote", label: "Parte 1 · Frente" },
      { key: "finger", label: "Parte 2 · Finger" },
      { key: "parte3", label: "Parte 3 · Frente" },
      { key: "parte4", label: "Parte 4 . 2 GPU Frente 1" },
      { key: "parte5", label: "Parte 5 . 2 GPU Frente 2" },
      { key: "parte6", label: "Parte 6 . 2 GPU Finger 1" },
      { key: "parte7", label: "Parte 7 . 2 GPU Front 32B" },
      { key: "gold", label: "Documentos gold" },
    ];
    let vault = null;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
    function b64(s) {
      const bin = atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function deriveKey(user, pass, salt, iter) {
      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey(
        "raw", enc.encode(user + "\0" + pass), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }
    async function unlock(user, pass) {
      const wrap = await fetch("data/vault.json").then((r) => {
        if (!r.ok) throw new Error("no está vault.json");
        return r.json();
      });
      const key = await deriveKey(user, pass, b64(wrap.s), wrap.iter);
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(wrap.iv) },
        key,
        b64(wrap.ct)
      );
      return JSON.parse(new TextDecoder().decode(pt));
    }
    function currentKey() {
      const h = (location.hash || "#parte5").replace("#", "");
      return PARTES.some((p) => p.key === h) ? h : "parte5";
    }
    function renderNav(idx, active) {
      const by = Object.fromEntries((idx || []).map((x) => [x.key, x]));
      document.getElementById("nav").innerHTML = PARTES.map((p) => {
        const s = by[p.key] || {};
        let badge = "";
        if (p.key === "gold") badge = '<span class="badge">' + (s.jobs || "") + "</span>";
        else if (s.cumple_meta) badge = '<span class="badge ok">≥1250</span>';
        else badge = '<span class="badge no">' + (s.docs_per_hour || "—") + "</span>";
        return '<a href="#' + p.key + '" class="' + (p.key === active ? "active" : "") + '"><span>' +
          esc(p.label) + "</span>" + badge + "</a>";
      }).join("");
    }
    function renderCampos(list, selEl, tableEl, title) {
      selEl.textContent = title;
      if (!list || !list.length) {
        tableEl.innerHTML = "<tbody><tr><td class='muted'>Sin campos</td></tr></tbody>";
        return;
      }
      tableEl.innerHTML = "<thead><tr><th>Campo</th><th>Valor</th><th>Conf.</th></tr></thead><tbody>" +
        list.map((c) => {
          const cls = (c.confianza || 0) >= 90 ? "ok" : "no";
          const val = (c.valor === 0 || c.valor) ? c.valor : "—";
          return "<tr><td>" + esc(c.etiqueta) + "</td><td>" + esc(val) + "</td><td class='" + cls + "'>" +
            (c.confianza == null ? "—" : esc(c.confianza) + "%") + "</td></tr>";
        }).join("") + "</tbody>";
    }
    function render(d) {
      const conf = d.confianza || {};
      const avgCampos = conf.campos || [];
      const rows = d.rows || [];
      const vl = ((d.modelos || [])[0] || {}).nombre || "—";
      const docsH = d.docs_per_hour == null ? "—" : d.docs_per_hour;
      const cumple = d.key === "gold"
        ? '<b>—</b><span>eval gold</span>'
        : d.cumple_meta
          ? '<b class="ok">sí</b><span>cumple ≥1250</span>'
          : '<b class="no">no</b><span>no cumple ≥1250</span>';
      document.getElementById("main").innerHTML = `
        <h1>${esc(d.titulo)}</h1>
        <p class="muted">${esc(vl)}</p>
        <div class="kpis">
          <div class="kpi"><b>${esc(d.listo)}/${esc(d.jobs)}</b><span>listos</span></div>
          <div class="kpi"><b>${esc(docsH)}</b><span>docs/h</span></div>
          <div class="kpi">${cumple}</div>
          <div class="kpi"><b>${esc(d.elapsed_fmt)}</b><span>duración</span></div>
          <div class="kpi"><b>${conf.general != null ? conf.general + "%" : "—"}</b><span>confianza media</span></div>
        </div>
        <p class="muted">${esc(d.workers || "")} · concurrencia ${esc(d.concurrency || "—")} · errores ${esc(d.errores)}</p>
        <div class="lote-grid">
          <div class="tabla-wrap">
            <table>
              <thead><tr><th>#</th><th>Formulario</th><th>Estado</th><th>Confianza</th><th>Hora</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="captura">
            <h2 style="font-size:1rem;margin:0 0 .4rem">Captura</h2>
            <p class="muted" id="sel">Clic en una fila para ver los campos extraídos.</p>
            <table class="mini" id="campos"></table>
          </div>
        </div>
      `;
      document.getElementById("rows").innerHTML = rows.map((r) =>
        `<tr data-id="${esc(r.id)}"><td>${esc(r.n)}</td><td>${esc(r.formulario)}</td><td>${esc(r.estado_label)}</td><td class="${(r.confianza || 0) >= 90 ? "ok" : "no"}">${r.confianza == null ? "—" : r.confianza + "%"}</td><td>${esc(r.hora || "—")}</td></tr>`
      ).join("");
      const byId = Object.fromEntries(rows.map((r) => [r.id, r]));
      if (avgCampos.length) {
        renderCampos(
          avgCampos.map((c) => ({ etiqueta: c.etiqueta, valor: "media lote", confianza: c.confianza })),
          document.getElementById("sel"),
          document.getElementById("campos"),
          "Confianza media del lote. Clic en una fila para el documento."
        );
      }
      document.getElementById("rows").addEventListener("click", (ev) => {
        const tr = ev.target.closest("tr");
        if (!tr) return;
        document.querySelectorAll("#rows tr").forEach((x) => x.classList.toggle("active", x === tr));
        const doc = byId[tr.getAttribute("data-id")];
        if (!doc) return;
        renderCampos(
          doc.campos,
          document.getElementById("sel"),
          document.getElementById("campos"),
          doc.id + (doc.ruta ? " · " + doc.ruta : "")
        );
      });
    }
    function showApp() {
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;
      document.body.classList.add("in");
      const go = () => {
        const key = currentKey();
        renderNav(vault.index, key);
        render(vault.partes[key]);
      };
      window.addEventListener("hashchange", go);
      go();
    }
    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "Abriendo…";
      try {
        vault = await unlock(
          document.getElementById("user").value.trim(),
          document.getElementById("pass").value
        );
        showApp();
      } catch (e) {
        err.textContent = "Usuario o contraseña incorrectos.";
      }
    });
    document.getElementById("out").addEventListener("click", () => {
      vault = null;
      location.hash = "";
      location.reload();
    });
  </script>
</body>
</html>
