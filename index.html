<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDP local — visor E-3</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
    body { margin: 0; min-height: 100vh; }
    body.in { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    [hidden] { display: none !important; }
    body > aside { background: #111827; color: #e5e7eb; padding: 1rem; overflow: auto; }
    body > aside a { color: inherit; text-decoration: none; display: block; padding: .4rem .5rem; border-radius: 6px; }
    body > aside a:hover, body > aside a.active { background: #374151; }
    .nav { margin: 0 0 1.1rem; padding: 0 0 .9rem; border-bottom: 1px solid #374151; }
    .nav h2 { margin: 0 0 .65rem; font-size: 1rem; }
    .nav a { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .badge { font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; color: #93c5fd; }
    .badge.run { color: #fbbf24; }
    .badge.ok { color: #34d399; }
    .badge.no { color: #fca5a5; }
    main { padding: 1.5rem 2rem; min-width: 0; }
    .estado { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
    body > aside .estado { color: #9ca3af; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: .5rem .4rem; }
    th { color: #6b7280; font-size: .8rem; }
    .ok { color: #047857; font-weight: 600; }
    .warn { color: #b45309; }
    code { background: #f3f4f6; padding: .1rem .3rem; border-radius: 4px; }
    .resumen { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin: 0 0 1.5rem; }
    .resumen h1, .resumen h2 { margin: 0 0 .5rem; font-size: 1.15rem; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; margin: .6rem 0; }
    .mini { width: 100%; margin-top: .5rem; }
    .mini th, .mini td { font-size: .82rem; padding: .35rem .3rem; }
    .conf-bar { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; min-width: 64px; }
    .conf-bar > i { display: block; height: 100%; background: #2563eb; }
    .conf-bar.warn > i { background: #d97706; }
    .kpi { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: .6rem .75rem; }
    .kpi b { display: block; font-size: 1.15rem; }
    .kpi span { font-size: .75rem; color: #6b7280; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .cols ul { margin: .3rem 0 0; padding-left: 1.1rem; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin: .4rem 0 1rem; }
    .bar > i { display: block; height: 100%; background: #2563eb; }
    .bar.run > i { background: #d97706; }
    .tabla-wrap { max-height: 62vh; overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
    .tabla-wrap table { margin: 0; }
    .tabla-wrap thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
    .tabla-wrap tbody tr:hover { background: #f9fafb; }
    .tabla-wrap tbody tr.active { background: #eff6ff; }
    .tabla-wrap tbody tr { cursor: pointer; }
    .muted { color: #6b7280; }
    .lote-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(340px, 1fr); gap: 1rem; align-items: start; }
    .captura { border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; padding: .85rem 1rem 1rem; max-height: 62vh; overflow: auto; }
    .captura h2 { margin: 0 0 .35rem; font-size: 1rem; }
    .captura table { margin-top: .5rem; }
    .login {
      min-height: 100vh; display: grid; place-items: center;
      background: #111827; color: #e5e7eb;
    }
    .card {
      background: #1f2937; border: 1px solid #374151; border-radius: 10px;
      padding: 1.5rem 1.6rem; width: min(380px, 92vw);
    }
    .card h1 { color: #fff; margin: 0 0 .35rem; }
    .card label { display: block; font-size: .8rem; color: #9ca3af; margin: .7rem 0 .25rem; }
    .card input {
      width: 100%; box-sizing: border-box; padding: .55rem .6rem;
      border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff;
    }
    .card button {
      margin-top: 1rem; width: 100%; padding: .6rem; border: 0; border-radius: 6px;
      background: #2563eb; color: #fff; font-weight: 600; cursor: pointer;
    }
    .err { color: #fca5a5; font-size: .85rem; min-height: 1.2em; margin-top: .5rem; }
    .out { color: #93c5fd; font-size: .8rem; cursor: pointer; margin: .8rem .5rem 0; }
  </style>
</head>
<body>
  <div id="gate" class="login">
    <form class="card" id="form">
      <h1>Visor E-3</h1>
      <p class="estado" style="color:#9ca3af;text-transform:none;letter-spacing:0">Acceso para el comité. Los datos van cifrados en GitHub Pages.</p>
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" required>
      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <aside id="aside" hidden>
    <nav class="nav" id="nav"></nav>
    <div id="side-note"></div>
    <p class="out" id="out">Cerrar sesión</p>
  </aside>
  <main id="main" hidden></main>
  <script>
    const SPECS = {
      lote: {
        nav: "Parte 1 · Frente",
        blurb: "Frente E-3 300 dpi. Resultado cerrado: no se borra al correr finger.",
        done: "Terminó. Este es el resultado del load test.",
        note: "Vista Parte 1 · Frente 1.251 (cerrada). No se borra.",
        table: "Documentos parte 1 (frente)",
        ids: "lt",
        layout: "front",
        gpu: "vram",
        disclaimer: "Confianza = lo que reporta el extractor, no el score vs gold (87.2% es otra métrica, en Homologación).",
        vramNote: "docling",
        perfil: "Perfil front (300 dpi).",
      },
      finger: {
        nav: "Parte 2 · Finger",
        blurb: "Huellas 500 dpi. Vista aparte: no pisa la parte 1.",
        done: "Terminó. Resultado de finger.",
        note: "Vista Parte 2 · Finger. No pisa Parte 1 ni Parte 3.",
        table: "Documentos parte 2 (finger)",
        ids: "fg",
        layout: "finger",
        gpu: "finger",
        disclaimer: "Confianza = lo que reporta el extractor, no el score vs gold.",
        vramNote: "docling",
        perfil: "Perfil finger (500 dpi). Mismo pipeline que la parte 1 (Docling + VL-7B + NLP 7B). No es YOLO.",
      },
      parte3: {
        nav: "Parte 3 · Frente",
        blurb: "Misma prueba de frente que Parte 1, IDs nuevos p3*. El bug NLP de braille ya está corregido. No borra Parte 1 ni Parte 2.",
        done: "Terminó. Este es el resultado del load test.",
        note: "Vista Parte 3 · Frente 1.251 (repetición). IDs p3*. No pisa Parte 1.",
        table: "Documentos parte 3 (frente)",
        ids: "p3",
        layout: "front",
        gpu: "vram",
        disclaimer: "Confianza = lo que reporta el extractor, no el score vs gold (87.2% es otra métrica, en Homologación).",
        vramNote: "docling",
        perfil: "Perfil front (300 dpi).",
      },
      parte4: {
        nav: "Parte 4 . 2 GPU Frente 1",
        blurb: "Misma prueba de frente, ahora en 2× RTX PRO 6000: VL-7B en GPU 0, NLP-7B en GPU 1. RapidOCR de ROIs apagado. IDs p4*. No borra Partes 1–3 ni gold.",
        done: "Terminó. Este es el resultado del load test.",
        note: "Vista Parte 4 . 2 GPU Frente 1. IDs p4*. No pisa Parte 5.",
        table: "Documentos parte 4 (frente, 2 GPU)",
        ids: "p4",
        layout: "front",
        gpu: "dual",
        disclaimer: "Confianza = lo que reporta el extractor, no el score vs gold (87.2% es otra métrica, en Homologación). Esta corrida es de throughput, no reevalúa gold.",
        vramNote: "dual4",
        perfil: "Perfil front (300 dpi).",
      },
      parte5: {
        nav: "Parte 5 . 2 GPU Frente 2",
        blurb: "Repetición limpia de frente en 2× GPU (VL-7B + NLP-7B, ROIs apagados, sin huella). IDs p5*. No borra Parte 4 ni gold.",
        done: "Terminó. Este es el resultado del load test.",
        note: "Vista Parte 5 . 2 GPU Frente 2. IDs p5*. Corrida limpia; no pisa Parte 4.",
        table: "Documentos parte 5 (frente, 2 GPU)",
        ids: "p5",
        layout: "front",
        gpu: "dual",
        disclaimer: "Confianza = lo que reporta el extractor, no el score vs gold. Corrida limpia: formulario_no por regex, sin huella_presente, sin reinicios a mitad.",
        vramNote: "dual5",
        perfil: "Perfil front (300 dpi).",
      },
      parte6: {
        nav: "Parte 6 . 2 GPU Finger 1",
        blurb: "Load test finger 500 dpi en 2× GPU (mismo pipeline VL-7B + NLP-7B). IDs p6*. No borra Parte 2 (fg*) ni las pruebas de frente.",
        done: "Terminó. Este es el resultado del load test.",
        note: "Vista Parte 6 . 2 GPU Finger 1. IDs p6*. Perfil finger 500 dpi. No pisa Parte 2.",
        table: "Documentos parte 6 (finger, 2 GPU)",
        ids: "p6",
        layout: "front",
        gpu: "finger2",
        disclaimer: "Esto no es YOLO de huellas. Es el mismo IDP (Docling + VL-7B + NLP) sobre las TIF finger. Parte 2 (fg*) queda como está.",
        vramNote: "p6",
        perfil: "Perfil finger (500 dpi).",
      },
      parte7: {
        nav: "Parte 7 . 2 GPU Front 32B",
        blurb: "Frente 1.251 con Qwen2.5-VL-32B-Instruct-AWQ en GPU 0 y NLP 7B en GPU 1. IDs p7*. No borra Partes 4–6 ni gold.",
        done: "Terminó. Este es el resultado del load test.",
        note: "Vista Parte 7 . 2 GPU Front 32B. IDs p7*. VL-32B-AWQ + NLP 7B.",
        table: "Documentos parte 7 (frente, VL-32B)",
        ids: "p7",
        layout: "front",
        gpu: "vl32",
        disclaimer: "El gold 100 con 32B ya midió CORE 83.8% (peor que 7B). Esta corrida es throughput + confianza del visor, IDs p7* no pisan gold.",
        vramNote: "p7",
        perfil: "Perfil front (300 dpi).",
      },
    };
    const PARTE_KEYS = ["lote", "finger", "parte3", "parte4", "parte5", "parte6", "parte7"];
    let vault = null;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
    function b64(s) {
      const bin = atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function deriveKey(user, pass, salt, iter) {
      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey(
        "raw", enc.encode(user + "\0" + pass), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }
    async function unlock(user, pass) {
      const wrap = await fetch("data/vault.json").then((r) => {
        if (!r.ok) throw new Error("no está vault.json");
        return r.json();
      });
      const key = await deriveKey(user, pass, b64(wrap.s), wrap.iter);
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(wrap.iv) },
        key,
        b64(wrap.ct)
      );
      return JSON.parse(new TextDecoder().decode(pt));
    }
    function currentKey() {
      const h = (location.hash || "#home").replace("#", "") || "home";
      if (h === "home" || h === "gold" || h === "pruebas") return h;
      return SPECS[h] ? h : "home";
    }
    function dph(d) {
      return d.docs_per_hour == null ? "—" : d.docs_per_hour;
    }
    function badgeParte(d) {
      if (!d) return "";
      if (d.estado === "corriendo" || d.estado === "encolando") return '<span class="badge run">en curso</span>';
      if (d.estado === "listo") return '<span class="badge ok">listo</span>';
      if (d.hay_lote) return '<span class="badge">' + esc(d.listo) + "/" + esc(d.jobs) + "</span>";
      return "";
    }
    function renderNav(active) {
      const p = vault.partes || {};
      const gold = p.gold || {};
      const lote = p.lote || {};
      let pruebasBadge = "";
      if (lote.estado === "listo") pruebasBadge = '<span class="badge ok">1.251</span>';
      const links = [
        ["home", "Homologación", ""],
        ["gold", "Documentos gold", '<span class="badge">' + (gold.listo || 0) + "/" + (gold.jobs || 0) + "</span>"],
        ["pruebas", "Pruebas", pruebasBadge],
      ].concat(PARTE_KEYS.map((k) => [k, SPECS[k].nav, badgeParte(p[k])]));
      document.getElementById("nav").innerHTML = "<h2>IDP local</h2>" + links.map(([k, label, badge]) =>
        '<a href="#' + k + '" class="' + (k === active ? "active" : "") + '"><span>' + esc(label) + "</span>" + badge + "</a>"
      ).join("");
    }
    function kpi(b, s, cls) {
      return '<div class="kpi"><b' + (cls ? ' class="' + cls + '"' : "") + ">" + b + "</b><span>" + s + "</span></div>";
    }
    function gpuBox(d, mode) {
      const v = d.vram || {};
      if (mode === "dual") return kpi("2× 96 GB", "GPU0 VL-7B · GPU1 NLP-7B");
      if (mode === "vl32") return kpi("VL-32B-AWQ", "GPU 0 · NLP 7B en GPU 1");
      if (mode === "finger") return kpi("500 dpi", "perfil finger · IDs fg*");
      if (mode === "finger2") return kpi("500 dpi", "perfil finger · 2× GPU");
      return kpi(esc(v.used_gb) + " / " + esc(v.total_gb) + " GB", esc(v.gpu || "") + " · nvidia-smi");
    }
    function vramFooter(d, mode) {
      const v = d.vram || {};
      if (mode === "dual4") return "Dos GPUs: VL ~83 GB en GPU 0, NLP ~40 GB en GPU 1. Docling no ocupa VRAM. RapidOCR de ROIs está apagado en esta corrida.";
      if (mode === "dual5") return "Dos GPUs: VL ~83 GB en GPU 0, NLP ~40 GB en GPU 1. Docling no ocupa VRAM. RapidOCR de ROIs está apagado.";
      if (mode === "p6") return "Dos GPUs: VL-7B GPU 0, NLP-7B GPU 1. Mismo stack que Parte 5, otras imágenes.";
      if (mode === "p7") return "GPU 0 ~89 GB (32B-AWQ). GPU 1 NLP 7B. El 32B es más lento que el 7B; no se espera superar a Parte 5 en docs/h.";
      return "Total GPU ~" + (v.used_gb || "—") + " GB / " + (v.total_gb || "—") + " GB (" + (v.used_mib || "—") + " / " + (v.total_mib || "—") + " MiB). Docling y RapidOCR no ocupan VRAM.";
    }
    function estadoLine(d, spec) {
      if (d.estado === "encolando") return "Encolando en Rabbit…";
      if (d.estado === "corriendo") return "En curso — esta vista se actualiza sola.";
      if (d.estado === "timeout") return "Terminó por timeout (quedaron docs en cola).";
      return spec.done;
    }
    function confRows(campos) {
      if (!campos || !campos.length) return "<tr><td colspan='3' class='muted'>Aún no hay docs listos con campos.</td></tr>";
      return campos.map((c) => {
        const cls = c.confianza >= 90 ? "ok" : "warn";
        const bar = c.confianza < 90 ? " warn" : "";
        return "<tr><td>" + esc(c.etiqueta) + "</td><td class='" + cls + "'>" + esc(c.confianza) +
          "%</td><td><div class='conf-bar" + bar + "'><i style='width:" + esc(c.confianza) + "%'></i></div></td></tr>";
      }).join("");
    }
    function modelRows(modelos) {
      return (modelos || []).map((m) =>
        "<tr><td><code>" + esc(m.nombre) + "</code></td><td>" + esc(m.rol) + "</td><td>" + esc(m.donde) + "</td><td>" + esc(m.vram) + "</td></tr>"
      ).join("");
    }
    function capturaHtml() {
      return `<div class="captura" id="captura">
        <h2 id="cap-titulo">Captura</h2>
        <p class="estado" id="cap-estado">Sin documento</p>
        <p id="cap-ruta" class="muted">Clic en una fila de la izquierda.</p>
        <p class="warn" id="cap-error" hidden></p>
        <table>
          <thead><tr><th>Etiqueta</th><th>Valor capturado</th><th>Confianza</th></tr></thead>
          <tbody id="cap-campos"><tr><td colspan="3" class="muted">Todavía no hay un registro seleccionado.</td></tr></tbody>
        </table>
      </div>`;
    }
    function bindCaptura(d) {
      const byId = Object.fromEntries((d.rows || []).map((r) => [String(r.id), r]));
      const body = document.getElementById("rows");
      if (!body) return;
      body.addEventListener("click", (ev) => {
        const tr = ev.target.closest("tr[data-id]");
        if (!tr) return;
        document.querySelectorAll("#rows tr").forEach((x) => x.classList.toggle("active", x === tr));
        showCampos(byId[tr.getAttribute("data-id")]);
      });
    }
    function showCampos(doc) {
      if (!doc) return;
      document.getElementById("cap-titulo").textContent = doc.id || "Captura";
      document.getElementById("cap-estado").textContent = doc.estado || "";
      const ruta = document.getElementById("cap-ruta");
      ruta.innerHTML = doc.ruta ? ("Ruta: <code>" + esc(doc.ruta) + "</code>") : "";
      const err = document.getElementById("cap-error");
      if (doc.error) { err.hidden = false; err.textContent = doc.error; }
      else { err.hidden = true; err.textContent = ""; }
      const list = doc.campos || [];
      const tbody = document.getElementById("cap-campos");
      if (!list.length) {
        tbody.innerHTML = "<tr><td colspan='3' class='muted'>Aún no hay campos (OCR/NLP en curso).</td></tr>";
        return;
      }
      tbody.innerHTML = list.map((c) => {
        const cls = (c.confianza || 0) >= 90 ? "ok" : "warn";
        const val = (c.valor === 0 || c.valor) ? c.valor : "—";
        return "<tr><td>" + esc(c.etiqueta) + "</td><td>" + esc(val) + "</td><td class='" + cls + "'>" + esc(c.confianza) + "%</td></tr>";
      }).join("");
    }
    function rowHtml(r) {
      let conf = "";
      if (r.en_proceso) conf = '<span class="muted">en proceso</span>';
      else if (String(r.estado || "").startsWith("error")) conf = '<span class="warn">error</span>';
      else {
        const cls = (r.confianza || 0) >= 90 ? "ok" : "warn";
        conf = '<span class="' + cls + '">' + (r.confianza == null ? "—" : r.confianza + "%") + "</span>";
      }
      return "<tr data-id='" + esc(r.id) + "'><td>" + esc(r.n) + "</td><td>" + esc(r.formulario) + "</td><td>" +
        esc(r.estado_label) + "</td><td>" + conf + "</td><td class='muted'>" + esc(r.hora || "—") + "</td></tr>";
    }
    function renderParte(key) {
      const spec = SPECS[key];
      const d = vault.partes[key] || {};
      const conf = d.confianza || {};
      const modelos = d.modelos || [];
      document.getElementById("side-note").innerHTML = '<p class="estado">' + esc(spec.note) + "</p>";
      const confCls = (conf.general || 0) >= 90 ? "ok" : "warn";
      const metaCls = d.cumple_meta ? "ok" : "warn";
      let kpis = "";
      if (spec.layout === "finger") {
        kpis = `<div class="kpis">
          ${kpi(esc(d.listo) + "/" + esc(d.jobs), "listos (<span>" + esc(d.pct) + "</span>%)")}
          ${kpi(esc(dph(d)), "docs/h")}
          ${kpi(esc(d.elapsed_fmt), "tiempo transcurrido")}
          ${kpi(esc(d.errores), "errores")}
        </div>
        <div class="kpis">
          ${kpi(conf.general != null ? conf.general + "%" : "—", "confianza general finger", confCls)}
          ${kpi(esc(d.cola), "en cola / proceso")}
          ${kpi(esc(conf.n_docs || 0), "docs listos en el promedio")}
          ${gpuBox(d, spec.gpu)}
        </div>`;
      } else {
        kpis = `<div class="kpis">
          ${kpi(esc(d.listo) + "/" + esc(d.jobs), "listos (<span>" + esc(d.pct) + "</span>%)")}
          ${kpi(esc(dph(d)), "docs/h (meta " + esc(d.meta) + ")")}
          ${kpi(esc(d.elapsed_fmt), "tiempo transcurrido")}
          ${kpi(d.cumple_meta ? "sí" : "no", "cumple ≥ " + esc(d.meta) + " docs/h", metaCls)}
        </div>
        <div class="kpis">
          ${kpi(esc(d.errores), "errores OCR/NLP")}
          ${kpi(esc(d.cola), "aún en cola / proceso")}
          ${kpi(esc(d.concurrency || "—"), "POSTs concurrentes")}
          ${kpi(esc(d.workers || "3 OCR + 2 NLP"), "workers (prefetch=1)")}
        </div>
        <div class="kpis">
          ${kpi(conf.general != null ? conf.general + "%" : "—", "confianza general (promedio de campos en docs listos)", confCls)}
          ${kpi(esc(conf.n_docs || 0), "docs listos usados para el promedio")}
          ${gpuBox(d, spec.gpu)}
          ${kpi(String(modelos.length), "motores en este pipeline")}
        </div>`;
      }
      const running = d.estado === "corriendo" || d.estado === "encolando";
      document.getElementById("main").innerHTML = `
        <section class="resumen">
          <h1>${esc(d.titulo || spec.nav)}</h1>
          <p class="estado">${esc(spec.blurb)}</p>
          <p>${esc(estadoLine(d, spec))}</p>
          <div class="bar${running ? " run" : ""}"><i style="width:${esc(d.pct || 0)}%"></i></div>
          ${kpis}
          <p class="estado">${esc(spec.disclaimer)}</p>
          <div class="cols">
            <div>
              <p class="estado">Confianza por campo</p>
              <table class="mini">
                <thead><tr><th>Campo</th><th>Confianza</th><th></th></tr></thead>
                <tbody>${confRows(conf.campos)}</tbody>
              </table>
            </div>
            <div>
              <p class="estado">Modelos y VRAM</p>
              <table class="mini">
                <thead><tr><th>Modelo</th><th>Rol</th><th>Dónde</th><th>VRAM</th></tr></thead>
                <tbody>${modelRows(modelos)}</tbody>
              </table>
              <p class="estado" style="margin:.5rem 0 0">${esc(vramFooter(d, spec.vramNote))}</p>
            </div>
          </div>
          <p class="estado">IDs <code>${esc(spec.ids)}${esc(d.stamp || "")}-*</code>${d.meta ? " · Meta cliente ≥" + esc(d.meta) + " docs/h." : ""} ${esc(spec.perfil)}</p>
        </section>
        <div class="lote-grid">
          <div>
            <h2 style="margin:0 0 .4rem;font-size:1rem">${esc(spec.table)}</h2>
            <p class="estado" style="margin:0 0 .6rem">Clic en un registro para ver la captura. Primera procesada arriba.</p>
            <div class="tabla-wrap">
              <table>
                <thead><tr><th>#</th><th>Formulario</th><th>Estado</th><th>Confianza</th><th>Hora</th></tr></thead>
                <tbody id="rows">${(d.rows || []).map(rowHtml).join("")}</tbody>
              </table>
            </div>
          </div>
          ${capturaHtml()}
        </div>`;
      bindCaptura(d);
    }
    function renderHome() {
      const r = vault.resumen || {};
      const gold = vault.partes.gold || {};
      document.getElementById("side-note").innerHTML = '<p class="estado">Elegí un menú. Gold = calidad. Parte 1 / Parte 2 = pruebas.</p>';
      document.getElementById("main").innerHTML = `
        <section class="resumen">
          <h2>Estado homologación v2 — ${esc(r.fecha)}</h2>
          <p>${esc(r.imagenes)}</p>
          <div class="kpis">
            ${kpi(esc(r.score_core), "calidad core (meta " + esc(r.meta_calidad) + ")")}
            ${kpi(esc(gold.listo) + "/" + esc(gold.jobs), "docs gold listos")}
            ${kpi(esc(r.vram), "VRAM g7e (vLLM 7B AWQ)")}
            ${kpi(esc(r.throughput), "pico meta " + esc(r.meta_pico))}
          </div>
          <div class="cols">
            <div><p class="estado">Hecho</p><ul>${(r.hecho || []).map((x) => "<li>" + esc(x) + "</li>").join("")}</ul></div>
            <div><p class="estado">Falta</p><ul>${(r.falta || []).map((x) => "<li>" + esc(x) + "</li>").join("")}</ul></div>
          </div>
          <p class="estado" style="margin:.75rem 0 0">
            Score anterior: ${esc(r.score_prev)} → ahora ${esc(r.score_core)}.
            Pruebas: ${PARTE_KEYS.map((k) => '<a href="#' + k + '">' + esc(SPECS[k].nav) + "</a>").join(" · ")}.
          </p>
        </section>`;
    }
    function renderPruebas() {
      document.getElementById("side-note").innerHTML = '<p class="estado">Clic Parte 1 a 7: cada una abre su vista.</p>';
      const line = (k) => {
        const d = vault.partes[k] || {};
        return '<p><a href="#' + k + '">' + esc(SPECS[k].nav) + "</a> — " +
          esc(d.listo) + "/" + esc(d.jobs) + " listos · " + esc(dph(d)) + " docs/h · " + esc(d.errores) + " errores</p>";
      };
      document.getElementById("main").innerHTML =
        "<h1>Pruebas</h1><p class='estado'>Cada ítem del menú abre su propia vista. No están apiladas en esta página.</p>" +
        PARTE_KEYS.map(line).join("");
    }
    function renderGold() {
      const d = vault.partes.gold || {};
      const rows = d.rows || [];
      document.getElementById("side-note").innerHTML =
        '<p class="estado">100 frentes E-3 (gold)</p>' +
        rows.map((r) => '<a href="#gold" data-gid="' + esc(r.id) + '">' + esc(r.id) +
          '<br><span class="estado">' + esc(r.estado) + "</span></a>").join("");
      document.getElementById("main").innerHTML = '<p class="estado">Elegí un documento gold a la izquierda.</p>';
      document.getElementById("side-note").addEventListener("click", (ev) => {
        const a = ev.target.closest("a[data-gid]");
        if (!a) return;
        ev.preventDefault();
        document.querySelectorAll("#side-note a").forEach((x) => x.classList.toggle("active", x === a));
        const doc = rows.find((r) => String(r.id) === a.getAttribute("data-gid"));
        if (!doc) return;
        const list = doc.campos || [];
        document.getElementById("main").innerHTML = `
          <h1>${esc(doc.id)}</h1>
          <p class="estado">${esc(doc.estado)}</p>
          <p>Ruta: <code>${esc(doc.ruta || "")}</code></p>
          ${doc.error ? '<p class="warn">Error: ' + esc(doc.error) + "</p>" : ""}
          <table>
            <thead><tr><th>Etiqueta</th><th>Valor</th><th>Confianza</th></tr></thead>
            <tbody>${list.length ? list.map((c) => {
              const cls = (c.confianza || 0) >= 90 ? "ok" : "warn";
              const val = (c.valor === 0 || c.valor) ? c.valor : "—";
              return "<tr><td>" + esc(c.etiqueta) + "</td><td>" + esc(val) + "</td><td class='" + cls + "'>" + esc(c.confianza) + "%</td></tr>";
            }).join("") : "<tr><td colspan='3'>Aún no hay campos.</td></tr>"}</tbody>
          </table>`;
      });
    }
    function go() {
      const key = currentKey();
      renderNav(key);
      if (key === "home") renderHome();
      else if (key === "pruebas") renderPruebas();
      else if (key === "gold") renderGold();
      else renderParte(key);
    }
    function showApp() {
      document.getElementById("gate").hidden = true;
      document.getElementById("aside").hidden = false;
      document.getElementById("main").hidden = false;
      document.body.classList.add("in");
      window.addEventListener("hashchange", go);
      go();
    }
    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "Abriendo…";
      try {
        vault = await unlock(
          document.getElementById("user").value.trim(),
          document.getElementById("pass").value
        );
        showApp();
      } catch (e) {
        err.textContent = "Usuario o contraseña incorrectos.";
      }
    });
    document.getElementById("out").addEventListener("click", () => {
      vault = null;
      location.hash = "";
      location.reload();
    });
  </script>
</body>
</html>
